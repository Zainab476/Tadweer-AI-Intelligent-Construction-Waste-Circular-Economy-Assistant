kind = "web"
previewPath = "/"
title = "Tadweer"
version = "1.0.0"
id = "artifacts/tadweer"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23666

[services.development]
run = "pnpm --filter @workspace/tadweer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tadweer", "run", "build" ]
serve = "static"
publicDir = "artifacts/tadweer/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23666"
BASE_PATH = "/"
